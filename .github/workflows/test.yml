name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache the MongoDB binary that mongodb-memory-server downloads
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --forceExit
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # MONGODB_URI is set at runtime by mongodb-memory-server — no secret needed
